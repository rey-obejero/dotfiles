# ── Plugins ───────────────────────────────────────────────────────────────────
# TPM (Tmux Plugin Manager) handles installing/updating the plugins below.
# Use <prefix> + I to install and <prefix> + U to update.
# The default prefix is `C-b` (Ctrl-b). To change it, add e.g.:
#   unbind C-b
#   set -g prefix C-a
#   bind C-a send-prefix

set -g @plugin 'tmux-plugins/tpm'                         # The plugin manager itself.
set -g @plugin 'tmux-plugins/tmux-sensible'               # Sensible default tmux settings.
set -g @plugin 'tmux-plugins/tmux-resurrect'              # Persist and restore sessions on restart.

# ── Status bar ────────────────────────────────────────────────────────────────

set -g status on                                          # Show the status line.
set -g status-style bg=default,fg=#6e7781                 # Muted gray text on default background.
set -g status-left ""                                     # No content on the left side.
set -g status-right "#{session_name}"                     # Show only the session name on the right.
set -g status-right-style bg=default,fg=#6e7781           # Same muted gray on the right side.
set -g status-left-length 0                               # Truncate length for the left status.
set -g status-right-length 20                             # Truncate length for the right status.
set -g window-status-format " #W "                      # Format for an inactive window name.
set -g window-status-current-format " #W "              # Format for the current window name.
set -g window-status-current-style bg=default,fg=#1b1f24  # The current window is dark text.
set -g window-status-style bg=default,fg=#8c8e90          # Inactive windows are lighter gray.
set -g status-justify left                                # Left-align the window status entries.
set -g window-status-separator ""                         # No separator between window entries.

# ── Pane borders ──────────────────────────────────────────────────────────────

set -g pane-border-style fg=#f6f8fa                       # The inactive pane border is near-white.
set -g pane-active-border-style fg=#d0d7de                # The active pane border is slightly darker.

# ── Mouse & passthrough ───────────────────────────────────────────────────────

set -g mouse on                                           # Enable mouse scrolling, selection, and resize.
set -g allow-passthrough on                               # Let OSC and escape sequences reach the terminal.

# ── Keybindings ──────────────────────────────────────────────────────────────

# Create a new window after the current one (deterministic, unlike plain `c`).
bind c new-window -a

# Create a new window before the current one.
bind C new-window -b

# Jump to the last (previously active) window.
bind b last-window

# Move the current window one position left/right, keeping focus on it (repeatable).
bind -r < swap-window -t -1 \; select-window -t -1
bind -r > swap-window -t +1 \; select-window -t +1

# Kill the current window after confirmation.
bind & confirm-before -p "kill window? (y/n) " kill-window

# Kill the entire tmux server after confirmation.
bind K confirm-before -p "kill server? (y/n) " kill-server

# ── TPM init ──────────────────────────────────────────────────────────────────
# This must stay at the end of the file.

run '~/.tmux/plugins/tpm/tpm'
