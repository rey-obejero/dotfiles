modelRoles:
  default: commandcode/deepseek/deepseek-v4.1-flash
symbolPreset: nerd
composer:
  shape: pi
  tokenRate: true
theme:
  light: light-github
  dark: dark-github
setupVersion: 2
statusLine:
  preset: custom
  sessionAccent: true
  transparent: false
  separator: pipe
  leftSegments:
    - vim
    - model
    - mode
    - path
    - git
    - session_name
    - subagents
    - collab
    - time_spent
    - token_in
    - token_out
    - token_total
    - token_rate
    - cache_hit
    - cache_read
    - cost
    - context_pct
    - context_total
    - usage
  rightSegments:
    []
tui:
  tight: false
  vimMode: true
  vimModeDisplay: text
colorBlindMode: false
hideThinkingBlock: true
personality: friendly
tools:
  approvalMode: write
display:
  showTokenUsage: true
secrets:
  enabled: true
compaction:
  thresholdPercent: 70